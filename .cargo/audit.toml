# cargo-audit config — advisory gate.
#
# Carried from the predecessor repository, with the ignore list re-verified against
# THIS workspace's Cargo.lock rather than inherited on trust. Same ignore set as
# deny.toml, so both tools are green-on-known and a red always means a NEW finding.
#
# Each entry below was checked with `cargo tree -i <crate> --workspace` at extraction
# time; the finding is recorded next to it. Re-check on any dependency change — an
# ignore that outlives its reason is worse than no gate at all.

[advisories]
ignore = [
    # rkyv — present in Cargo.lock but UNREACHABLE: `cargo tree -i rkyv --workspace`
    # prints nothing for any target or feature set. Its only lockfile parent is
    # rust_decimal, whose `std` feature names the WEAK optional dependency
    # `rkyv?/std`; Cargo records weak optional dependencies in the lockfile even
    # when nothing activates them. Kept because cargo-audit reads the lockfile
    # without that analysis and goes red without it (checked 2026-10-11 — this is
    # NOT a stale ignore, whatever cargo-deny's `advisory-not-detected` says).
    "RUSTSEC-2026-0235",
    # bincode 1.3.3, unmaintained. Reachable, and ecosystem-pinned through the
    # Anchor / Agave dependency tree — not ours to move.
    "RUSTSEC-2025-0141",
    # libsecp256k1 0.7.2, unmaintained. Reachable, ecosystem-pinned as above.
    "RUSTSEC-2025-0161",
    # faster-hex 0.10.0, "unsound": `hex_decode_unchecked` can read past its input
    # on x86 AVX2. Reachable as a dependency (switchboard-on-demand, so it is in the
    # program's build graph), but Switchboard calls only the ENCODER `hex_string`,
    # and the program runs on SBF, not x86. 0.10.1 fixes it and is a semver-
    # compatible `cargo update -p faster-hex`; it changes a build input of the
    # deployed program, so it ships with the next program release and this entry
    # goes with it (scanner triage 2026-10-11, items G and H).
    "RUSTSEC-2026-0306",
    # crypto-bigint 0.5.5, timing variability in operations meant to be constant-
    # time (published 2026-10-24; fixed only in 0.7.6). Path: crypto-bigint <-
    # elliptic-curve 0.13 <- k256 0.13.4 <- solana-secp256k1-recover 3.3.0 <-
    # solana-program 3.0 (via mpl-core) and 4.1 (via switchboard-on-demand).
    # UNREACHABLE from the deployed program: solana-secp256k1-recover declares k256
    # only under `cfg(not(any(target_os = "solana", target_arch = "bpf")))` (its
    # Cargo.toml) and on SBF calls the `sol_secp256k1_recover` syscall instead, so
    # neither crate is compiled into the program; and the program never calls
    # secp256k1 recovery on any target (nothing in programs/ names it). The
    # services are TypeScript. No fix to take: the newest solana-secp256k1-recover
    # (3.3.0) still requires k256 ^0.13, i.e. crypto-bigint 0.5. Remove this entry
    # when the Solana crates move to k256 0.14 and the lockfile follows (checked
    # 2026-10-24).
    "RUSTSEC-2026-0387",
]
