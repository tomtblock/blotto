[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
blotto_cup = "4pspHqtbdgqKTvSxvKFT2ycEU28u3EWdxjmj3xsTHD3Y"

[programs.localnet]
blotto_cup = "5aawXayPYgEqrnHi6pGiYRpuHNuwauj8GqftRjkeXH17"

[provider]
cluster = "localnet"
