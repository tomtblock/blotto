[test.validator]
bind_address = "127.0.0.1"
faucet_port = 9900
ledger = ".anchor/test-ledger"
rpc_port = 8899

[surfpool]
startup_wait = 5000
shutdown_wait = 2000
rpc_port = 8899
ws_port = 8900
host = "127.0.0.1"
