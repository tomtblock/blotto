# Standalone integration-test crate — NOT a workspace member (see the root
# Cargo.toml). It executes the compiled program artifact
# (`target/deploy/blotto_cup.so`) inside LiteSVM, an in-process SVM, driving
# it with raw, hand-encoded Anchor instructions. It never links the program
# crate: the point is to test the ARTIFACT through the same byte-level
# interface a client uses, and to keep agave 4.x (LiteSVM's runtime) out of
# the program's Solana 3.x dependency graph.
[package]
name = "blotto-litesvm-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-sdk = "=4.0.0"
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
borsh = "=1.5.7"

[profile.dev]
# The SVM interprets the SBF binary; unoptimized host code makes 64-entry
# pools crawl.
opt-level = 2
