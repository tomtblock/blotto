[workspace]
resolver = "2"
members = [
    "crates/blotto-randomness", # class randomness digest + class draw (carried, Phase 0)
    "programs/blotto_cup",      # Anchor program (Phase 1)
]
# The LiteSVM integration suite lives OUTSIDE the workspace: it drives the
# compiled .so through agave 4.x host crates, which must not unify with the
# program's Solana 3.x dependency graph. It has its own lockfile and is
# decoupled from the program crate entirely (raw instruction bytes).
exclude = ["tests/litesvm"]

[profile.release]
# An arithmetic overflow in a money or scoring path is a bug, not a wraparound.
# Panicking in release is deliberate — see CLAUDE.md, hard rules.
overflow-checks = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
