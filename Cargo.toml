[workspace]
resolver = "2"
members = [
    "crates/blotto-randomness", # class randomness digest + class draw (carried, Phase 0)
    "crates/blotto-scoring",    # all-vs-all battle scoring (new work, Phase 2)
    "crates/blotto-merkle",     # class table + results Merkle trees (new work, Phase 1/2)
]

[profile.release]
# An arithmetic overflow in a money or scoring path is a bug, not a wraparound.
# Panicking in release is deliberate — see CLAUDE.md, hard rules.
overflow-checks = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
