# Devnet backend deploy (founder-triggered): the indexer (read API + webhook
# receiver) and the packet service onto Fly.io, Frankfurt, per
# docs/hosting.md. Run it from the Actions tab ("Run workflow") — it is
# never triggered by a push, because deploying is a decision, not a side
# effect of merging.
#
# Requires two REPOSITORY SECRETS (Settings → Secrets and variables →
# Actions), created by the founder per docs/deploy-backend.md:
#   FLY_API_TOKEN        — a Fly.io deploy token
#   BLOTTO_DATABASE_URL  — the managed Postgres connection string (EU region)
#
# Everything else is derived here:
#   - BLOTTO_HELIUS_WEBHOOK_SECRET and ENTRY_SIGNER_SEED_HEX are generated
#     ONCE (first run) and kept across runs — regenerating the entry-signer
#     seed would silently change the signer's public key.
#   - GEO_STUB_COUNTRY=GB: the DEV geo stub (no vendor is contracted yet —
#     R2). Every lookup resolves as GB, so the territory gate passes for
#     everyone; the real block-list bites once a geo vendor is configured.
#     Devnet-only posture, recorded in docs/deploy-backend.md.
#   - BLOTTO_API_CORS_ORIGINS names the app's production origin, exactly.
#
# The indexer image's `sync` entry runs migrations itself at boot, so there
# is no separate migration job; deploy order (indexer first) guarantees the
# tables exist before the packet service accepts traffic.

name: deploy-backend

on:
  workflow_dispatch:
    inputs:
      include_settlement_services:
        description: "Also deploy the daemon + review services (C5/C6 - needs their credentials first)"
        type: boolean
        default: false

concurrency: deploy-backend

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  INDEXER_APP: blotto-indexer
  PACKET_APP: blotto-packet
  DAEMON_APP: blotto-daemon
  REVIEW_APP: blotto-review
  APP_ORIGIN: https://blotto-jade.vercel.app
  DEVNET_RPC: https://api.devnet.solana.com
  PROGRAM_ID: 5aawXayPYgEqrnHi6pGiYRpuHNuwauj8GqftRjkeXH17

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the two required secrets exist
        run: |
          missing=0
          [ -z "${{ secrets.FLY_API_TOKEN }}" ] && echo "::error::FLY_API_TOKEN repository secret is not set — see docs/deploy-backend.md step 2" && missing=1
          [ -z "${{ secrets.BLOTTO_DATABASE_URL }}" ] && echo "::error::BLOTTO_DATABASE_URL repository secret is not set — see docs/deploy-backend.md step 3" && missing=1
          exit $missing

      - name: Create the Fly apps (first run only)
        run: |
          flyctl apps create "$INDEXER_APP" || echo "$INDEXER_APP exists (or the name is taken — see docs/deploy-backend.md troubleshooting)"
          flyctl apps create "$PACKET_APP" || echo "$PACKET_APP exists (or the name is taken — see docs/deploy-backend.md troubleshooting)"

      - name: Stage indexer secrets
        run: |
          flyctl secrets set --app "$INDEXER_APP" --stage \
            BLOTTO_DATABASE_URL="${{ secrets.BLOTTO_DATABASE_URL }}" \
            BLOTTO_RPC_URL="$DEVNET_RPC" \
            BLOTTO_PROGRAM_ID="$PROGRAM_ID" \
            BLOTTO_API_CORS_ORIGINS="$APP_ORIGIN"
          # Generate-once: the webhook receiver refuses to start without a
          # secret (E6 fail-closed). Helius gets this value when the webhook
          # is created (docs/hosting.md); until then nothing calls it.
          if ! flyctl secrets list --app "$INDEXER_APP" | grep -q BLOTTO_HELIUS_WEBHOOK_SECRET; then
            flyctl secrets set --app "$INDEXER_APP" --stage \
              BLOTTO_HELIUS_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          fi

      - name: Deploy indexer
        run: flyctl deploy . --config deploy/fly/indexer.fly.toml --remote-only --yes --ha=false

      - name: Stage packet secrets
        run: |
          flyctl secrets set --app "$PACKET_APP" --stage \
            BLOTTO_DATABASE_URL="${{ secrets.BLOTTO_DATABASE_URL }}" \
            BLOTTO_API_CORS_ORIGINS="$APP_ORIGIN" \
            GEO_STUB_COUNTRY="GB"
          # Generate-once: regenerating would change the entry signer's
          # public key mid-flight. Dev seed per docs/hosting.md; Turnkey
          # replaces it at the credentialed rehearsal (C11).
          if ! flyctl secrets list --app "$PACKET_APP" | grep -q ENTRY_SIGNER_SEED_HEX; then
            flyctl secrets set --app "$PACKET_APP" --stage \
              ENTRY_SIGNER_SEED_HEX="$(openssl rand -hex 32)"
          fi

      - name: Deploy packet service
        run: flyctl deploy . --config deploy/fly/packet.fly.toml --remote-only --yes --ha=false

      - name: Smoke-check the entry-path services
        run: |
          sleep 10
          for url in \
            "https://$INDEXER_APP.fly.dev/health" \
            "https://$PACKET_APP.fly.dev/health" \
            "https://$PACKET_APP.fly.dev/geo"; do
            echo "GET $url"
            curl --fail --silent --show-error --max-time 20 "$url" && echo
          done
          echo "Backend is up. Next: set the two NEXT_PUBLIC_* URLs in Vercel (docs/deploy-backend.md step 6)."

      # --- C5 / C6: the settlement-path services -------------------------
      # daemon.fly.toml and review.fly.toml have existed since E5, but no
      # workflow ever deployed them, so neither Fly app exists and the crank
      # has never run on a real cluster. Off by default: ticking the input
      # above is a deliberate act, and the step below refuses loudly rather
      # than deploying a service that would crash-loop on a missing
      # credential. Nothing here loosens a fail-closed path - the services
      # still refuse to boot without their credentials; this only declines
      # to deploy them before those credentials exist.
      - name: Settlement services - check their credentials first
        if: ${{ inputs.include_settlement_services }}
        run: |
          missing=""
          [ -z "${{ secrets.RANDOMNESS_ACCOUNT }}" ] && missing="$missing RANDOMNESS_ACCOUNT"
          [ -z "${{ secrets.IRYS_UPLOAD_KEY }}" ] && missing="$missing IRYS_UPLOAD_KEY"
          [ -z "${{ secrets.TURNKEY_API_BASE_URL }}" ] && missing="$missing TURNKEY_API_BASE_URL"
          [ -z "${{ secrets.TURNKEY_API_PUBLIC_KEY }}" ] && missing="$missing TURNKEY_API_PUBLIC_KEY"
          [ -z "${{ secrets.TURNKEY_API_PRIVATE_KEY }}" ] && missing="$missing TURNKEY_API_PRIVATE_KEY"
          [ -z "${{ secrets.TURNKEY_ORGANIZATION_ID }}" ] && missing="$missing TURNKEY_ORGANIZATION_ID"
          [ -z "${{ secrets.TURNKEY_USER_ID }}" ] && missing="$missing TURNKEY_USER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not deploying the settlement services. Missing repository secrets:$missing"
            echo "::error::Set them under Settings -> Secrets and variables -> Actions, then run this workflow again."
            exit 1
          fi
          # OPEN DECISION (raised with the founder, Stage A follow-up):
          # both services read SETTLEMENT_SIGNER_KEYPAIR as a PATH to a
          # keypair JSON. A Fly secret is an environment variable, not a
          # file, and docs/hosting.md offers two unimplemented options (a
          # base64 secret written out by a release command, or a volume).
          # The custody disclosure page states the mounted-path model, so
          # changing it is a founder decision with a documentation
          # consequence - not something to settle inside a deploy script.
          echo "::error::SETTLEMENT_SIGNER_KEYPAIR delivery is undecided - see docs/hosting.md and the Stage A follow-up. Deploy blocked here deliberately."
          exit 1

      - name: Create the settlement Fly apps
        if: ${{ inputs.include_settlement_services }}
        run: |
          flyctl apps create "$DAEMON_APP" || echo "$DAEMON_APP exists"
          flyctl apps create "$REVIEW_APP" || echo "$REVIEW_APP exists"

      - name: Stage daemon secrets
        if: ${{ inputs.include_settlement_services }}
        run: |
          flyctl secrets set --app "$DAEMON_APP" --stage \
            BLOTTO_DATABASE_URL="${{ secrets.BLOTTO_DATABASE_URL }}" \
            BLOTTO_RPC_URL="$DEVNET_RPC" \
            BLOTTO_PROGRAM_ID="$PROGRAM_ID" \
            RANDOMNESS_ACCOUNT="${{ secrets.RANDOMNESS_ACCOUNT }}" \
            IRYS_UPLOAD_KEY="${{ secrets.IRYS_UPLOAD_KEY }}" \
            IRYS_NETWORK="devnet" \
            TURNKEY_API_BASE_URL="${{ secrets.TURNKEY_API_BASE_URL }}" \
            TURNKEY_API_PUBLIC_KEY="${{ secrets.TURNKEY_API_PUBLIC_KEY }}" \
            TURNKEY_API_PRIVATE_KEY="${{ secrets.TURNKEY_API_PRIVATE_KEY }}" \
            TURNKEY_ORGANIZATION_ID="${{ secrets.TURNKEY_ORGANIZATION_ID }}" \
            TURNKEY_USER_ID="${{ secrets.TURNKEY_USER_ID }}"

      - name: Deploy daemon
        if: ${{ inputs.include_settlement_services }}
        run: flyctl deploy . --config deploy/fly/daemon.fly.toml --remote-only --yes --ha=false

      - name: Stage review secrets
        if: ${{ inputs.include_settlement_services }}
        run: |
          flyctl secrets set --app "$REVIEW_APP" --stage \
            BLOTTO_DATABASE_URL="${{ secrets.BLOTTO_DATABASE_URL }}" \
            BLOTTO_RPC_URL="$DEVNET_RPC" \
            BLOTTO_PROGRAM_ID="$PROGRAM_ID" \
            BLOTTO_API_CORS_ORIGINS="$APP_ORIGIN"

      - name: Deploy review service
        if: ${{ inputs.include_settlement_services }}
        run: flyctl deploy . --config deploy/fly/review.fly.toml --remote-only --yes --ha=false

      - name: Smoke-check the settlement services
        if: ${{ inputs.include_settlement_services }}
        run: |
          sleep 10
          for url in \
            "https://$DAEMON_APP.fly.dev/health" \
            "https://$REVIEW_APP.fly.dev/health"; do
            echo "GET $url"
            curl --fail --silent --show-error --max-time 20 "$url" && echo
          done
          echo "Settlement services are up. The daemon health body carries the LAST TICK summary."
