# skill-evidence — the nightly evidence lane (D-A2, ratified 2026-08-27).
#
# Re-runs the full skill-evidence study — at every pool size of the Ladder
# (D-E19: 8, 16, 32 and 64 players), each full and at its minimum field, the
# 200-pool mixed run plus the three 200-pool homogeneous-field runs (v2
# amendment), all deterministic from the base seed — and fails if a fresh
# run no longer reproduces the committed docs/skill-evidence/ artifacts
# (results.csv, results.json, REPORT.md; hard/ for the hard board). An engine
# change that shifts outcome statistics must land together with regenerated
# evidence — this lane turns silent drift into a red build.
#
# Nightly, not per push (ratified): each board is 6,400 pools through the
# real crank, about 7.5 minutes on a developer machine. Since the Ladder
# re-run (2026-11-05) the two boards run as parallel matrix jobs, so neither
# shares its 30-minute budget with the other. workflow_dispatch is kept for
# on-demand runs.
name: skill-evidence

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [easy, hard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies the study imports
        run: |
          (cd backend/_shared && npm ci)
          (cd backend/scoring && npm ci)
          (cd backend/class-digest && npm ci)
          (cd backend/sealing && npm ci)
          (cd backend/detection && npm ci)
          (cd backend/reveal && npm ci)
          (cd tests/rehearsal && npm ci)
      - name: Reproduce the committed ${{ matrix.mode }}-board evidence (200 pools per run)
        run: cd tests/rehearsal && SKILL_EVIDENCE_CHECK=1 SKILL_EVIDENCE_MODE=${{ matrix.mode }} npm run skill-evidence
