# Dependency advisories — the lane that runs cargo-deny, cargo-audit and
# npm's advisory check (audit 2026-09-11, findings B-50 / G-21 / G-24).
#
# Both Rust configurations have existed since extraction and have been kept
# current by hand — `deny.toml` and `.cargo/audit.toml` carry the same
# curated ignore list, each entry justified and re-verified against THIS
# workspace's Cargo.lock. Neither tool was invoked by any workflow. Every
# npm install in this repository passes `--no-audit`. So the ignore lists
# were maintained for a check that never ran, and a newly published advisory
# against anything we ship would have been noticed by nobody.
#
# ── BLOCKING OR ADVISORY? ───────────────────────────────────────────────────
#
# Both, split by WHOSE FAULT a red result is.
#
#   The RUST half BLOCKS. It can, honestly, because the condition for
#   blocking is met: `deny.toml` and `.cargo/audit.toml` carry a triaged
#   ignore list with the reachability finding recorded next to each entry, so
#   a red result there always means a NEW finding. Both tools were run
#   against this lockfile on 2026-09-12 before this lane was written:
#   `cargo deny check advisories` says "advisories ok" and `cargo audit`
#   reports nothing, so the lane is green the day it lands.
#
#   Corrected by the scanner triage of 2026-10-11
#   (docs/security/SCANNER-TRIAGE-2026-10-11.md, item G):
#     - this comment used to call RUSTSEC-2026-0235 and -0190 stale. Only
#       -0190 was (anyhow 1.0.104 is patched) and it is gone. -0235 (rkyv)
#       is a weak optional dependency cargo-deny can see through and
#       cargo-audit cannot: drop it and `cargo audit` goes red;
#     - cargo-deny reported "unsound" advisories only for workspace crates,
#       so RUSTSEC-2026-0306 (faster-hex, transitive) passed silently.
#       deny.toml now sets `unsound = "all"`;
#     - the LiteSVM workspace (tests/litesvm, its own lockfile) was never
#       audited. It now is, with its own triaged lists;
#     - `cargo deny check licenses` now runs against the licence policy in
#       deny.toml (founder ruling 2026-10-11).
#
#   The NPM half now BLOCKS too, on HIGH and CRITICAL only, against a
#   committed baseline (scripts/npm-advisory-baseline.json) in which every
#   accepted advisory carries its reachability finding — the condition this
#   header used to set for blocking. Until 2026-10-11 it reported and never
#   failed, and next 16.3.0's three critical advisories sat in that report
#   unread until an external scanner listed them. Moderate and low are still
#   reported, never gated.
#
# On the daily schedule nothing blocks a DEPLOY at all, and the mechanism is
# deliberately minimal: this workflow is simply not part of the deploy gate.
# scripts/ci-gate.sh requires ci-fast to be green and on-chain not to be red,
# and names both; it does not consult this lane, so a red sweep cannot stop a
# deploy. The schedule is how an advisory published overnight gets noticed
# without stopping every unrelated change in the repository until someone
# triages it. Watch it the way backend-watch is watched — Actions failure
# notifications.
#
# It is a separate WORKFLOW, not a job inside ci-fast, for the reason the
# audit gives: a red advisory must not sit in the same run as a red test,
# where it competes for attention with a failure someone can actually fix
# now. And the two halves below are separate JOBS so a Rust advisory and an
# npm one are reported independently rather than one hiding the other.
#
# Not audited, deliberately: the repository root's yarn.lock. It holds the
# root's dev tooling only, no runtime dependency of any deployed service, and
# `npm audit` there would want a package-lock.json the root must not have.
#
# ── VERSIONS ────────────────────────────────────────────────────────────────
#
# The tools are pinned. An advisory lane that silently changes its own
# judgement between runs is worse than none: "it went red and nothing
# changed" is unanswerable. Bumping a pin is a change like any other, with
# the red run it may cause attached to it.

name: security-sweep

permissions:
  contents: read

on:
  schedule:
    # Daily, off the hour. Hosted runners queue at :00 and this lane is never
    # urgent.
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - '.cargo/audit.toml'
      # The LiteSVM workspace's own lockfile and lists (the literal
      # 'Cargo.lock' above matches the root file only).
      - 'tests/litesvm/Cargo.lock'
      - 'tests/litesvm/deny.toml'
      - 'tests/litesvm/.cargo/audit.toml'
      - '**/package-lock.json'
      - '**/package.json'
      - 'scripts/check-npm-advisories.mjs'
      - 'scripts/npm-advisory-baseline.json'
      - '.github/workflows/security-sweep.yml'

concurrency:
  group: security-sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  rust-advisories:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin as ci-fast's rust lane: a toolchain bump should never be the
      # reason an advisory result changed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: 1.95.0

      # Both tools take minutes to build from source, and neither changes
      # between runs. Keyed on the versions themselves, so a version bump
      # misses the cache exactly once.
      - name: Cache the advisory tools
        id: cache-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: advisory-tools-${{ runner.os }}-deny${{ env.CARGO_DENY_VERSION }}-audit${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-deny and cargo-audit (pinned)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny@${CARGO_DENY_VERSION} --locked
          cargo install cargo-audit@${CARGO_AUDIT_VERSION} --locked

      # BOTH tools run, and the verdict is taken at the end. Stopping at the
      # first failure would report one tool's findings and hide the other's,
      # which is the same fault `--no-fail-fast` fixed in the on-chain lane.
      #
      # Scope is `advisories` only, as deny.toml's own header states: a
      # licence/bans/sources policy is a separate decision and is not gated
      # here. cargo-audit reads .cargo/audit.toml, which carries the same
      # ignore list with the reachability finding recorded next to each
      # entry — so a red result from either tool always means a NEW finding.
      - name: cargo deny check advisories
        id: deny
        continue-on-error: true
        run: cargo deny check advisories

      - name: cargo audit
        id: audit
        continue-on-error: true
        run: cargo audit

      # The licence policy in deny.toml (founder ruling 2026-10-11): permissive
      # licences only, and mpl-core as a named, hash-pinned exception.
      - name: cargo deny check licenses
        id: licenses
        continue-on-error: true
        run: cargo deny check licenses

      # The LiteSVM integration workspace: test tooling with its own lockfile,
      # never compiled into the program. Its own lists live beside it
      # (tests/litesvm/deny.toml, tests/litesvm/.cargo/audit.toml) — cargo-deny
      # finds deny.toml next to the manifest, and cargo-audit reads
      # .cargo/audit.toml from the directory it runs in.
      - name: cargo deny check advisories (tests/litesvm)
        id: deny_litesvm
        continue-on-error: true
        run: cargo deny --manifest-path tests/litesvm/Cargo.toml check advisories

      - name: cargo audit (tests/litesvm)
        id: audit_litesvm
        continue-on-error: true
        working-directory: tests/litesvm
        run: cargo audit

      - name: Verdict
        run: |
          deny='${{ steps.deny.outcome }}'
          audit='${{ steps.audit.outcome }}'
          licenses='${{ steps.licenses.outcome }}'
          deny_litesvm='${{ steps.deny_litesvm.outcome }}'
          audit_litesvm='${{ steps.audit_litesvm.outcome }}'
          echo "cargo-deny advisories      : $deny"
          echo "cargo-audit                : $audit"
          echo "cargo-deny licences        : $licenses"
          echo "cargo-deny (tests/litesvm) : $deny_litesvm"
          echo "cargo-audit (tests/litesvm): $audit_litesvm"
          if [ "$licenses" != "success" ]; then
            echo "::error::a licence outside the policy in deny.toml — a new dependency, or a changed"
            echo "::error::licence text (mpl-core's is hash-pinned). Not ours to wave through: the policy"
            echo "::error::is a founder decision; raise it rather than widening the allow list."
          fi
          if [ "$deny" = "success" ] && [ "$audit" = "success" ] && [ "$licenses" = "success" ] \
             && [ "$deny_litesvm" = "success" ] && [ "$audit_litesvm" = "success" ]; then
            echo "no new advisory against either lockfile, and every licence within policy"
            exit 0
          fi
          echo "::error::a NEW dependency advisory — see the two steps above for the RUSTSEC id"
          echo "::error::Triage it: if it is reachable from the program or a service, move the"
          echo "::error::dependency. If it is not, add the id to BOTH deny.toml and"
          echo "::error::.cargo/audit.toml with the reachability finding written next to it —"
          echo "::error::the two lists must stay identical, and an ignore that outlives its"
          echo "::error::reason is worse than no gate at all."
          exit 1

  npm-advisories:
    name: npm advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20

      # `npm audit` reads the lockfile and asks the registry; it does not
      # need node_modules, so nothing is installed here and the job is a
      # minute rather than ten.
      #
      # TWO REPORTS, THEN ONE GATE.
      #
      #   The first report is `--omit=dev --audit-level=high`: the RUNTIME
      #   dependencies, at the severities worth acting on, per package, into
      #   the run summary. Note what it is not: it is not "what the images
      #   contain". The four service images run `npm ci` WITHOUT --omit=dev
      #   (they start through ts-node, a dev dependency — deploy/docker/), so
      #   every dev dependency is in them too, present though never loaded.
      #   That is why the gate below audits the full tree.
      #
      #   The second report is the full tree including dev dependencies,
      #   printed in collapsed groups, moderate and low included.
      #
      #   The gate (scripts/check-npm-advisories.mjs) fails on any HIGH or
      #   CRITICAL advisory, dev included, that is not in
      #   scripts/npm-advisory-baseline.json with its reason.
      #
      # Every package directory with a package-lock.json is covered, in one
      # list (the gate's PACKAGE_DIRS is the same list). Until 2026-10-11 the
      # loops skipped battle-test and tests/postgres. The root is not audited:
      # see the header.
      - name: npm audit (runtime dependencies — reported)
        run: |
          {
            echo "### npm advisories in runtime dependencies"
            echo
            echo "\`npm audit --omit=dev --audit-level=high\`, per package. The gate step below decides"
            echo "pass or fail against the triaged baseline; this table only shows where they are."
            echo
            echo "| package | high or critical |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in app backend/_shared backend/scoring backend/class-digest backend/sealing \
                     backend/sanctions backend/reveal backend/indexer backend/packet \
                     backend/detection backend/watch battle-test tests/postgres tests/rehearsal; do
            echo "::group::$dir"
            if (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              echo "| $dir | none |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $dir | yes — see the job log and the gate step |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          {
            echo
            echo "Accepted, each with its reason in scripts/npm-advisory-baseline.json: \`app\` (braces"
            echo "under React Native's bundler, never shipped to the web) and \`backend/reveal\`"
            echo "(bigint-buffer, no fixed release, a code path the daemon does not run)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm audit (full tree, including dev — reported)
        if: always()
        run: |
          for dir in app backend/_shared backend/scoring backend/class-digest backend/sealing \
                     backend/sanctions backend/reveal backend/indexer backend/packet \
                     backend/detection backend/watch battle-test tests/postgres tests/rehearsal; do
            echo "::group::$dir (dev included)"
            (cd "$dir" && npm audit) || true
            echo "::endgroup::"
          done

      # THE GATE. Blocks on a high or critical advisory, dev included, that
      # nobody has triaged. Proven against this commit's predecessor: the
      # app lockfile with next 16.3.0 fails it with all of next's advisories.
      - name: npm advisory gate (high and critical, against the baseline)
        if: always()
        run: node scripts/check-npm-advisories.mjs
