# Rebuild the indexer from the chain, on demand.
#
# Why this exists (2026-09-09): the indexer's boot-time catch-up is best-effort
# (it never blocks serving), so a service that comes up with an empty ledger
# needs a hand-run walk of the chain. This workflow runs the same `backfill`
# (and, if asked, `re-derive`) inside the running indexer machine, with the
# machine's own secrets, and prints what it inserted. Idempotent: the ledger's
# (signature, event_index) key makes a second run insert nothing.
#
# Correction, same day: the first version of this header blamed public-RPC
# rate limiting for the empty read API. The real cause was in the service —
# it never registered its event layouts, so every walk decoded nothing
# ("16 tx, 0 inserted"). See the INCIDENT note in backend/indexer/src/index.ts.
# Read the "inserted" count in the log: zero on a chain with pools is a code
# defect, not a slow RPC.
#
# Read-only against the chain; writes only to the indexer's own database.
#
# 2026-09-12 (audit 2026-09-11, D-02): `archive-backfill` joins the modes AND
# runs on a daily schedule. It is the fallback that fills the verified-results
# archive — discover each settled pool's published bundle, verify it against
# the on-chain root, ingest — and it was invoked by nothing: not `sync`, not
# this workflow, not a cron. With the daemon's announce also unstaged, no
# player could ever be shown a bundle. Idempotent ("safe to re-run",
# backend/indexer/src/index.ts), so a daily run costs nothing when the announce
# path has already done the work.
name: indexer-backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill = walk the chain into the ledger · re-derive = rebuild derived tables from the ledger · both = backfill then re-derive · archive-backfill = fill the verified-results archive from the published bundles"
        required: true
        default: both
        type: choice
        options: [backfill, re-derive, both, archive-backfill]
  schedule:
    # Daily archive-backfill. The announce path (deploy-backend.yml, D-02)
    # fills the archive within a minute of settlement; this catches a pool
    # whose announce was refused or lost, the way the chain backfill catches
    # a dropped webhook.
    - cron: '47 6 * * *'

concurrency:
  group: indexer-backfill
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  INDEXER_APP: blotto-indexer

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6, 2026-09-12

      - name: Preflight
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::FLY_API_TOKEN is not set"; exit 1; fi
          flyctl status --app "$INDEXER_APP"

      - name: Walk the chain into the ledger
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'backfill' || inputs.mode == 'both')
        run: |
          # Runs in the service's working directory (/app/backend/indexer) with
          # the machine's secrets (database, RPC, program id) already in env.
          flyctl ssh console --app "$INDEXER_APP" \
            -C "npx ts-node --transpile-only src/index.ts backfill"

      - name: Rebuild the derived tables from the ledger
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 're-derive' || inputs.mode == 'both')
        run: |
          flyctl ssh console --app "$INDEXER_APP" \
            -C "npx ts-node --transpile-only src/index.ts re-derive"

      - name: Fill the verified-results archive from the published bundles
        if: github.event_name == 'schedule' || inputs.mode == 'archive-backfill'
        run: |
          # Discover + verify + ingest every settled pool's bundle. Read the
          # count it prints: "0 settled pool(s)" on a chain with paid pools
          # means the read side cannot see them, not that there is nothing
          # to do.
          flyctl ssh console --app "$INDEXER_APP" \
            -C "npx ts-node --transpile-only src/index.ts archive-backfill"

      - name: What the read API now serves
        run: |
          echo "--- /pools ---"
          curl -sS --max-time 20 "https://$INDEXER_APP.fly.dev/pools" | head -c 2000; echo
          echo "--- /tiers ---"
          curl -sS --max-time 20 "https://$INDEXER_APP.fly.dev/tiers" | head -c 1000; echo
