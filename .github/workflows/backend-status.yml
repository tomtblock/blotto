# Founder-clickable diagnostics: prints each backend app's Fly status,
# machine list, and recent logs into the run output, so a crash can be
# diagnosed from the Actions page without anyone touching a terminal or
# copying anything. Read-only — it deploys nothing and changes nothing.
#
# Needs only the FLY_API_TOKEN repository secret (already set for
# deploy-backend).

name: backend-status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Status and logs for both services
        run: |
          # All four apps. Until 2026-09-06 this loop named only the indexer
          # and the packet service, so when the daemon deployed and then went
          # silent there was no founder-clickable way to see its machine
          # events, its check state or its logs — and a stalled daemon cannot
          # answer on its own health endpoint, because a failing check is
          # exactly what makes Fly's proxy stop routing to it. The log is the
          # only witness, so it has to be reachable from here.
          for app in blotto-indexer blotto-packet blotto-daemon blotto-review; do
            echo "===================== $app: status ====================="
            flyctl status --app "$app" || true
            echo "===================== $app: public IPs ================="
            flyctl ips list --app "$app" || true
            echo "===================== $app: checks ====================="
            # Which check is failing, and what it last returned. A machine can
            # be 'started' and still be out of rotation.
            flyctl checks list --app "$app" || true
            echo "===================== $app: machines ==================="
            flyctl machine list --app "$app" || true
            # Per-machine event history is the authoritative exit record:
            # exit code, OOM flag, restart count — logs can be truncated,
            # events are not. This is how "why did it stop" gets answered.
            for id in $(flyctl machine list --app "$app" --json | jq -r '.[].id'); do
              echo "===================== $app: machine $id events ========="
              flyctl machine status "$id" --app "$app" || true
            done
            echo "===================== $app: secret names ==============="
            flyctl secrets list --app "$app" || true
            echo "===================== $app: recent logs ================"
            flyctl logs --app "$app" --no-tail | tail -n 400 || true
            echo
          done
