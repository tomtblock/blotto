# ci-fast — the always-on lane.
#
# Six jobs:
#   rust           — fmt, clippy -D warnings, cargo test across the workspace
#                    (the program's unit tests and the 10k-case vault fuzz)
#   node           — every backend package (typecheck + test), the offline
#                    twenty-pool rehearsal, and the app's lint / typecheck /
#                    test / build
#   postgres       — the migrations applied to an EMPTY database, and every
#                    Postgres-backed store driven against the schema they
#                    produce (audit 2026-09-11, A-03 / G-03 / G-04 / G-17)
#   journey        — the browser journey over the production build in fixture
#                    mode, at 375px and 1280px (audit 2026-09-11, G-20 / A-33)
#   gitleaks       — the checkout AND the git history, pinned binary,
#                    checksum-verified
#   standing-rules — thirteen checks, in this order: the PID §8.7 language gate,
#                    the structural greps, the founder's territory schedule,
#                    the operator identity behind the terms and privacy notice,
#                    the wallet blocklist's recorded grounds, the published
#                    numbers against the program's constants, the fill
#                    simulation's self-test, the upgrade pre-flight's verdict,
#                    the env-example coverage check, the container-user check,
#                    the Python oracles' fixtures, the Rust↔TypeScript mirror
#                    check, and the self-tests of the deploy gate and the
#                    program-deploy script
#
# No Solana CLI or Anchor install here — nothing in this lane builds SBF. The
# compiled artifact and the LiteSVM suite that drives it are the separate
# `on-chain` lane, which runs when on-chain code changes. A change to
# programs/ or tests/litesvm/ is NOT verified by this lane alone.
name: ci-fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustc pinned so a silent stable-channel bump can never be the reason a
      # change goes red.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Standard proptest count — no PROPTEST_CASES override. The deep run belongs
      # to a scheduled lane, not the always-on one.
      - name: cargo test
        run: cargo test --workspace

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/_shared/package-lock.json
            backend/scoring/package-lock.json
            backend/class-digest/package-lock.json
            backend/sealing/package-lock.json
            backend/sanctions/package-lock.json
            backend/reveal/package-lock.json
            backend/indexer/package-lock.json
            backend/packet/package-lock.json
            backend/detection/package-lock.json
            tests/rehearsal/package-lock.json

      # Order matters: later packages type-check against earlier ones' source
      # trees (the relative re-export convention), so every package installs
      # before any tests run.
      - name: install
        run: |
          for pkg in _shared scoring class-digest sealing sanctions reveal indexer packet detection; do
            (cd "backend/$pkg" && npm ci --no-audit --no-fund)
          done

      - name: typecheck + test
        run: |
          for pkg in _shared scoring class-digest sealing sanctions reveal indexer packet detection; do
            echo "=== backend/$pkg ==="
            (cd "backend/$pkg" && npm run typecheck && npm test)
          done

      - name: rehearsal (offline twenty-pool settlement)
        run: |
          cd tests/rehearsal
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: app install
        run: cd app && npm ci --no-audit --no-fund

      - name: app lint + typecheck + test + build
        run: |
          cd app
          npm run lint
          npm run typecheck
          npm test
          npm run build

  # THE ONLY LANE THAT STARTS A DATABASE (audit 2026-09-11, A-03 / G-03 /
  # G-04 / G-17). Until now no test in the repository executed a single line
  # of SQL: all twenty-one migrations, the migration runner and every
  # Postgres-backed store were driven only through in-memory doubles, and two
  # live defects came straight out of that shape — the archive rewrote the
  # served rankings outside any transaction (B-20 / F-05) and the decision log
  # destroyed the signed timestamp on read-back (A-04). Neither is reachable
  # by a test that never meets a real schema, a real transaction or a real
  # unique constraint.
  #
  # IT LIVES HERE, NOT IN ITS OWN WORKFLOW, for two reasons. `stop-the-line`
  # watches `ci-fast` and nothing else (A-12), so a separate lane would be a
  # red that files no alarm; and a path filter on a suite whose whole purpose
  # is to catch cross-boundary drift would reintroduce the blind spot it
  # exists to close — a migration is only ever wrong in company.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned by digest: a service image is as much a dependency as an
        # action, and `postgres:16` is a moving tag.
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16, 2026-09-12
        env:
          POSTGRES_USER: blotto
          POSTGRES_PASSWORD: blotto
          POSTGRES_DB: blotto_ci_test
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts
        # connections; without this the first spec races the container.
        options: >-
          --health-cmd "pg_isready -U blotto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/_shared/package-lock.json
            backend/scoring/package-lock.json
            backend/sealing/package-lock.json
            backend/sanctions/package-lock.json
            backend/indexer/package-lock.json
            backend/packet/package-lock.json
            backend/detection/package-lock.json
            tests/postgres/package-lock.json

      # The suite imports each store from its own package's source tree, so
      # every package whose store it drives has to be installed — the same
      # relative re-export convention the `node` job's ordering comment
      # describes.
      - name: install
        run: |
          for pkg in _shared scoring sealing sanctions indexer packet detection; do
            (cd "backend/$pkg" && npm ci --no-audit --no-fund)
          done
          (cd tests/postgres && npm ci --no-audit --no-fund)

      - name: typecheck
        run: cd tests/postgres && npm run typecheck

      # THE GATE IS PROVED BEFORE IT IS TRUSTED. Without
      # BLOTTO_TEST_DATABASE_URL every case in this package is pending, which
      # is the right behaviour on a developer machine with no server and
      # exactly the wrong thing to discover in CI: a lane reporting a green
      # zero. So the run is checked for the case count it must have.
      - name: The migrations and every Postgres-backed store
        env:
          BLOTTO_TEST_DATABASE_URL: postgres://blotto:blotto@localhost:5432/blotto_ci_test
        run: |
          # The default shell on a Linux runner is `bash -e`, WITHOUT
          # pipefail — so `npm test | tee` would report the exit status of
          # `tee` and a failing suite would pass this step silently.
          set -euo pipefail
          cd tests/postgres
          npm test 2>&1 | tee /tmp/pg-suite.log
          # `|| true` on BOTH, and it is load-bearing rather than defensive.
          # Mocha prints no "pending" line at all when nothing is pending, so
          # on a clean run that grep matches nothing and exits 1 — which
          # `pipefail` propagates out of the pipeline and `set -e` turns into a
          # failed step. The first run of this lane reported exactly that: 36
          # passing, 0 failing, step red, and the failure was the guard rather
          # than the suite. An absent count means zero, which is what the two
          # tests below already assume.
          passing="$(grep -oE '[0-9]+ passing' /tmp/pg-suite.log | head -1 | cut -d' ' -f1 || true)"
          pending="$(grep -oE '[0-9]+ pending' /tmp/pg-suite.log | head -1 | cut -d' ' -f1 || true)"
          echo "passing=${passing:-0} pending=${pending:-0}"
          if [ "${pending:-0}" -ne 0 ]; then
            echo "FAIL: ${pending} case(s) were skipped — the database gate did not see its URL" >&2
            exit 1
          fi
          if [ "${passing:-0}" -lt 30 ]; then
            echo "FAIL: only ${passing:-0} cases ran; this suite has more than that" >&2
            exit 1
          fi

  # THE ONLY LANE THAT OPENS A BROWSER (audit 2026-09-11, G-20 / A-33).
  #
  # `app/e2e/journey.spec.ts` existed, passed, and was invoked by nothing:
  # `npm test` is vitest and its include pattern excludes `e2e/`, and no
  # workflow ran `npm run journey`. So every assertion it makes about what a
  # player actually sees — the 18+/territory line in the viewport without
  # scrolling, §8.6 above the enter control, the dev gallery 404ing in a
  # production build, no horizontal scroll at 375px — was unenforced.
  #
  # IT NEEDS A FIXTURE-MODE BUILD. `NEXT_PUBLIC_FIXTURE_DATA=1` is compiled
  # in, so it has to be on the BUILD and `next start` cannot supply it
  # (app/playwright.config.ts carries the full reasoning). Without it every
  # page renders the "live data unavailable" state and every assertion here
  # fails — which is the deliberate consequence of the A-07 fix.
  #
  # The Lighthouse gate is NOT here: it is real, it is maintained, and it
  # does not currently pass (performance 75 on /, 88 on the pool page against
  # a threshold of 90, measured 2026-09-12). Blocking every PR on a
  # pre-existing product deficiency is not what an always-on lane is for, and
  # lowering a founder-set threshold to make a lane green is not a decision a
  # workflow gets to take. It runs in `app-lighthouse.yml` instead, where the
  # numbers are visible and the founder can act on them.
  journey:
    name: journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/_shared/package-lock.json
            backend/scoring/package-lock.json
            backend/class-digest/package-lock.json
            backend/sealing/package-lock.json
            backend/reveal/package-lock.json
            backend/indexer/package-lock.json
            backend/packet/package-lock.json
            backend/detection/package-lock.json

      # THE APP BUILD REACHES INTO backend/, so installing only `app` is not
      # enough. The app imports backend sources directly by relative path (the
      # repository's own convention) and those files resolve their vendor
      # packages from each backend package's OWN node_modules, so `next build`
      # cannot resolve them unless those packages are installed first. The
      # `node` job and `app-test-signer.yml` both install in this order for the
      # same reason; this lane did not, and failed with module-not-found from
      # inside `backend/` rather than with anything about the journey.
      #
      # `class-digest` is on the list because the fair-play test imports it to
      # replay the class draw — the F-18 fix. Adding an app-side import of a
      # backend package that is NOT on this list turns a green local build into
      # a failed lane here and a failed deploy on the hosting provider, whose
      # own install list lives in `app/vercel.json`.
      - name: install backend packages the app builds against
        run: |
          for pkg in _shared scoring class-digest sealing reveal indexer packet detection; do
            (cd "backend/$pkg" && npm ci --no-audit --no-fund)
          done

      - name: install
        run: cd app && npm ci --no-audit --no-fund

      # Chromium only: playwright.config.ts declares two Chromium projects
      # (a 375px mobile emulation and a 1280px desktop) and no other engine.
      - name: install chromium
        run: cd app && npx playwright install --with-deps chromium

      - name: build (fixture mode)
        run: cd app && NEXT_PUBLIC_FIXTURE_DATA=1 npm run build

      - name: the browser journey, at both mandated widths
        run: cd app && npm run journey

      # The journey writes the step report's screenshots as it goes. They are
      # committed artifacts, so a change here means the UI moved; uploading
      # them makes that reviewable instead of invisible. Never committed by
      # CI — this lane has read-only contents permission.
      - name: Screenshots from this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-screenshots
          path: docs/phase-reports/screenshots/step-ui-arena/
          if-no-files-found: error
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the `git` scan below needs commits, and a shallow
          # clone has none to give it (audit 2026-09-11, B-51). 237 commits
          # and 147 MB of objects — seconds, not minutes.
          fetch-depth: 0

      # Binary, not the license-gated wrapper action. Pinned version + checksum.
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # The checkout as it stands. This is what the lane has always done and
      # it stays: it sees files a history scan does not reason about, and it
      # is the fastest signal on the change in front of us.
      - name: Scan working tree
        run: |
          gitleaks dir . --no-banner --redact --config .gitleaks.toml \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-tree.json"

      # THE HISTORY (audit 2026-09-11, B-51). The working-tree scan sees only
      # what the checkout currently contains, so a key committed by mistake
      # and deleted in the next commit was invisible to this lane for ever —
      # while remaining perfectly readable to anyone who clones the
      # repository. Deleting a secret from the tip is not revoking it.
      #
      # WHICH RANGE, AND WHY. On a PR event, the branch's OWN commits: that
      # is the new history this change proposes to add, it is the only part
      # the author can still rewrite before it lands, and it keeps the cost
      # of the always-on lane proportional to the change rather than to the
      # repository. On a push to main, the WHOLE history — which is the
      # belt-and-braces pass, and the reason a schedule is not needed here:
      # every commit that reaches main is scanned in full on the way in, so
      # there is no window a nightly sweep would close that this does not.
      #
      # If a scan of main's full history ever grows past a minute or two,
      # move the `push` branch of this step to a scheduled workflow rather
      # than dropping it — but do not put it back to tree-only.
      - name: Scan the git history
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "scanning this branch's own commits"
            gitleaks git . --no-banner --redact --config .gitleaks.toml \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" \
              --log-opts "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            echo "scanning the full history ($(git rev-list --count HEAD) commits)"
            gitleaks git . --no-banner --redact --config .gitleaks.toml \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json"
          fi

      # WHAT WAS FOUND, NOT HOW MANY (2026-09-13).
      #
      # On 2026-09-12 this lane went red on main and said, in full:
      # `WRN leaks found: 7`. No rule, no path, no commit — because gitleaks
      # itemises findings only under `-v`, and this lane did not pass it. The
      # count blocked a backend deploy through `deploy-backend`'s gate, and
      # working out what the seven were took a clone, a pinned gitleaks build
      # and a JSON report. A gate that can stop a deploy has to be able to say
      # what it stopped it for.
      #
      # `--redact` stays on every invocation above, so the reports these read
      # carry `REDACTED` in place of every secret value. The table below prints
      # rule, file, line, commit and date, and never a value — so the log stays
      # safe to paste into a chat or an issue, which is exactly what an operator
      # does with it.
      - name: What was found
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for report in "$RUNNER_TEMP"/gitleaks-*.json; do
            count=$(jq 'length' "$report")
            [ "$count" -eq 0 ] && continue
            found=1
            echo "::group::$(basename "$report" .json) — $count finding(s)"
            jq -r '.[] | "  rule=\(.RuleID)\n    file=\(.File):\(.StartLine)\n    commit=\(.Commit[0:9])  date=\(.Date[0:10])  author=\(.Author)\n    fingerprint=\(.Fingerprint)"' "$report"
            echo "::endgroup::"
          done
          if [ "$found" = 1 ]; then
            echo "::error::gitleaks found secrets. Each finding is listed above with its fingerprint. Triage every one: a LIVE credential must be ROTATED at the provider — deleting it from the tip revokes nothing, it is already in the history. Only once a finding is proven dead or a false positive does its fingerprint go in .gitleaksignore, with the justification written beside it. Read that file's header before adding anything."
          fi

      # The reports themselves, for a finding whose context does not fit a log
      # line. Redacted, so they carry no secret value.
      - name: The findings, itemised
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-reports
          path: ${{ runner.temp }}/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7

  # Roadmap §3 standing rules 4–6: the PID §8.7 language gate and the two
  # structural greps (no `class` in the scoring path; the vault's exits are
  # exactly the enumerated set) run on every PR. Phase 0 left the language gate
  # manual because its brief scoped ci-fast to two lanes; BUILD-ROADMAP_v1.0.md
  # §3 now mandates it.
  standing-rules:
    name: standing-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Language gate (PID §8.7 + roadmap §6.4)
        run: ./scripts/check-language.sh

      - name: Structural rules (roadmap §3 rules 5–6)
        run: ./scripts/check-standing-rules.sh

      # The founder-owned territory schedule (founder instruction
      # 2026-09-12 §3.1). Four things can go wrong with config/territories.json
      # quietly; the one that matters is a SUB-NATIONAL code the geo vendor
      # cannot resolve, which makes the entry service refuse to start — a
      # deploy-time failure on a service that then will not come up. This
      # moves it onto the change that added the code, while it is still a
      # review comment rather than an outage.
      #
      # The first two TypeScript checks in this job, hence the Node setup
      # below. Both run off the repo-root toolchain rather than a workspace:
      # the territory check reads the packet service's real parser and the
      # app's name map and must not depend on either being installed.
      #
      # The fill-rule simulation (founder instruction 2026-09-12 §5.2)
      # RE-IMPLEMENTS the seal/refund boundary to measure it, so it is the one
      # place that can drift from the program while every other lane stays
      # green — and its output is a report the founder reads to decide whether
      # the numbers stay. Its self-test pins the same boundaries
      # tests/litesvm/tests/fill_rule.rs pins on chain.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20

      - name: Territory schedule (founder instruction 2026-09-12)
        run: npx --yes tsx@4.20.3 scripts/check-territories.ts

      # The founder-owned operator identity behind the terms and the privacy
      # notice (2026-09-19). On any cluster the file must parse and carry
      # every key, because both pages render "not yet set" from a null and
      # render NOTHING from a key that is not there. The values themselves
      # are null today and a mainnet deploy refuses them
      # (deploy-backend.yml); here the step prints what is still unset so it
      # cannot be quietly forgotten.
      - name: Operator identity schema (terms/privacy)
        run: npx --yes tsx@4.20.3 scripts/check-operator-identity.ts

      # The founder-owned wallet blocklist (2026-09-19) — the mechanism
      # behind the terms clause "Refusing entry and withholding a prize".
      # The clause undertakes to tell a refused player WHICH ground we
      # relied on, and the service stores no reason, so the ground is
      # recorded in config/blocked-wallets.README.md and this refuses a
      # build where an address is listed without one, or where a row cites
      # a ground the terms do not enumerate.
      - name: Wallet blocklist has a recorded ground per address
        run: npx --yes tsx@4.20.3 scripts/check-blocked-wallets.ts

      # A number a player reads must be the number the program enforces. On
      # 2026-09-12 R7-b moved MIN_SEATS 52 -> 40; three player-facing strings
      # kept the old figure and every gate in this lane reported clean,
      # because none of them looks at the copy. One of the three was the
      # screen shown immediately AFTER payment, where PID §8.6 requires the
      # fill deadline and refund rule to be stated accurately. This reads the
      # program's own constants.rs and refuses any rendered string still
      # carrying a superseded value — as digits or spelled out, because the
      # landing page spelled it.
      - name: Published numbers match the program (PID §8.6)
        run: npx --yes tsx@4.20.3 scripts/check-published-numbers.ts

      - name: The fill simulation still models the rule (§5.2)
        run: npx --yes tsx@4.20.3 scripts/sim/fill-replay.ts --self-test

      # The upgrade pre-flight's verdict (R7-b, 2026-09-13). Its failure mode
      # is silent permissiveness: a verdict that quietly stopped refusing would
      # report CLEAR for ever and the next program upgrade would land while a
      # pool was taking entries. Same reasoning as ci-gate.sh — the decision is
      # pure, so the fixtures need no cluster. It lives in its own module
      # precisely so it can run here with nothing installed; scripts/admin.ts
      # imports @solana/web3.js and could not.
      - name: The upgrade pre-flight still refuses (R7-b)
        run: npx --yes tsx@4.20.3 scripts/drain-verdict.ts --self-test

      # Widened 2026-09-12 to see `env.NAME` property reads, the backend's
      # dominant shape, which it was blind to (audit 2026-09-11, A-09 / E-07 /
      # D-38). It now self-tests before reporting, like its neighbours.
      - name: Env-example coverage (E1)
        run: ./scripts/check-env-examples.sh

      # Every service image drops to a non-root user before its entrypoint
      # (audit 2026-09-11, E-22). Two of the four decode the settlement
      # signer into shared memory at boot.
      - name: Container user (E-22)
        run: ./scripts/check-container-user.sh

      # The three Python oracles still produce the vectors that are committed
      # (audit 2026-09-11, F-13). These are the numbers a player recomputes
      # their own result against, and the whole point of computing them in a
      # second language is lost the moment the two can drift unobserved.
      - name: The Python oracles reproduce their fixtures (F-13)
        run: ./scripts/check-fixtures.sh

      # Rust and TypeScript still agree (audit 2026-09-11, F-11). Constants
      # mirrored by hand across the two languages, and the `#[event]` structs
      # against the decoders that read them field by field. A regression on
      # 2026-09-12 moved a Rust figure and left three TypeScript mirrors
      # behind, green in every lane; this is the check that catches that.
      - name: Rust and TypeScript agree (F-11)
        run: python3 scripts/check-mirrors.py

      # The deploy gate's decision logic (audit 2026-09-11, G-10 / E-16). Its
      # live inputs need a GitHub token, so the only way to know it still
      # judges correctly is to drive its pure halves through fixtures: twelve
      # lane verdicts and eleven decisions, six of which must REFUSE. A gate
      # that had quietly started answering "go" to everything would otherwise
      # pass CI for ever, which is the same fault it exists to catch.
      - name: The deploy gate still judges correctly
        run: ./scripts/ci-gate.sh --self-test

      # The program-deploy script's two decisions (audit 2026-09-11, A-11 /
      # E-18): which URL a cluster name resolves to, and whether the node
      # said "no program here" or failed to answer at all. Both need a
      # cluster to exercise live, and both were wrong in a way that disabled
      # the programdata-extend guard silently, so both are driven through
      # fixtures here instead.
      - name: The program deploy still tells an outage from a fresh cluster
        run: ./scripts/deploy-devnet.sh --self-test
