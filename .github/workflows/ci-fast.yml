# ci-fast — the always-on lane.
#
# Carried from the predecessor repository's ci-fast, with the services and web jobs
# dropped: this
# repository has no service or web suite yet (Phase 0 carried the plumbing, not a
# runnable service). Add those lanes back in the phase that makes them runnable.
#
# Two jobs:
#   rust      — fmt, clippy -D warnings, cargo test across the workspace
#   node      — the backend TypeScript suites (scoring oracle vectors, sealing,
#               crank, indexer projection over real emitted bytes) + typecheck
#   gitleaks  — filesystem scan of the checkout, pinned binary, checksum-verified
#
# No Solana CLI or Anchor install here — nothing in this lane builds SBF. The
# on-chain suite (anchor build / anchor test against a local validator) is a
# separate lane, added when programs/blotto_cup has accounts to test against.
name: ci-fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustc pinned so a silent stable-channel bump can never be the reason a
      # change goes red.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Standard proptest count — no PROPTEST_CASES override. The deep run belongs
      # to a scheduled lane, not the always-on one.
      - name: cargo test
        run: cargo test --workspace

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/_shared/package-lock.json
            backend/scoring/package-lock.json
            backend/class-digest/package-lock.json
            backend/sealing/package-lock.json
            backend/reveal/package-lock.json
            backend/indexer/package-lock.json
            backend/packet/package-lock.json
            backend/detection/package-lock.json

      # Order matters: later packages type-check against earlier ones' source
      # trees (the relative re-export convention), so every package installs
      # before any tests run.
      - name: install
        run: |
          for pkg in _shared scoring class-digest sealing reveal indexer packet detection; do
            (cd "backend/$pkg" && npm ci --no-audit --no-fund)
          done

      - name: typecheck + test
        run: |
          for pkg in _shared scoring class-digest sealing reveal indexer packet detection; do
            echo "=== backend/$pkg ==="
            (cd "backend/$pkg" && npm run typecheck && npm test)
          done

      - name: app install
        run: cd app && npm ci --no-audit --no-fund

      - name: app lint + typecheck + test + build
        run: |
          cd app
          npm run lint
          npm run typecheck
          npm test
          npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Binary, not the license-gated wrapper action. Pinned version + checksum.
      # Filesystem scan of the checkout only.
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

  # Roadmap §3 standing rules 4–6: the PID §8.7 language gate and the two
  # structural greps (no `class` in the scoring path; the vault's exits are
  # exactly the enumerated set) run on every PR. Phase 0 left the language gate
  # manual because its brief scoped ci-fast to two lanes; BUILD-ROADMAP_v1.0.md
  # §3 now mandates it.
  standing-rules:
    name: standing-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Language gate (PID §8.7 + roadmap §6.4)
        run: ./scripts/check-language.sh

      - name: Structural rules (roadmap §3 rules 5–6)
        run: ./scripts/check-standing-rules.sh
