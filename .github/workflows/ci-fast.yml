# ci-fast — the always-on lane.
#
# Four jobs:
#   rust           — fmt, clippy -D warnings, cargo test across the workspace
#                    (the program's unit tests and the 10k-case vault fuzz)
#   node           — every backend package (typecheck + test), the offline
#                    twenty-pool rehearsal, and the app's lint / typecheck /
#                    test / build
#   gitleaks       — the checkout AND the git history, pinned binary,
#                    checksum-verified
#   standing-rules — the PID §8.7 language gate, the structural greps, the
#                    env-example coverage check, the container-user check,
#                    the Python oracles' fixtures, the Rust↔TypeScript mirror
#                    check, and the self-tests of the deploy gate and the
#                    program-deploy script
#
# No Solana CLI or Anchor install here — nothing in this lane builds SBF. The
# compiled artifact and the LiteSVM suite that drives it are the separate
# `on-chain` lane, which runs when on-chain code changes. A change to
# programs/ or tests/litesvm/ is NOT verified by this lane alone.
name: ci-fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustc pinned so a silent stable-channel bump can never be the reason a
      # change goes red.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Standard proptest count — no PROPTEST_CASES override. The deep run belongs
      # to a scheduled lane, not the always-on one.
      - name: cargo test
        run: cargo test --workspace

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/_shared/package-lock.json
            backend/scoring/package-lock.json
            backend/class-digest/package-lock.json
            backend/sealing/package-lock.json
            backend/sanctions/package-lock.json
            backend/reveal/package-lock.json
            backend/indexer/package-lock.json
            backend/packet/package-lock.json
            backend/detection/package-lock.json
            tests/rehearsal/package-lock.json

      # Order matters: later packages type-check against earlier ones' source
      # trees (the relative re-export convention), so every package installs
      # before any tests run.
      - name: install
        run: |
          for pkg in _shared scoring class-digest sealing sanctions reveal indexer packet detection; do
            (cd "backend/$pkg" && npm ci --no-audit --no-fund)
          done

      - name: typecheck + test
        run: |
          for pkg in _shared scoring class-digest sealing sanctions reveal indexer packet detection; do
            echo "=== backend/$pkg ==="
            (cd "backend/$pkg" && npm run typecheck && npm test)
          done

      - name: rehearsal (offline twenty-pool settlement)
        run: |
          cd tests/rehearsal
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: app install
        run: cd app && npm ci --no-audit --no-fund

      - name: app lint + typecheck + test + build
        run: |
          cd app
          npm run lint
          npm run typecheck
          npm test
          npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the `git` scan below needs commits, and a shallow
          # clone has none to give it (audit 2026-09-11, B-51). 237 commits
          # and 147 MB of objects — seconds, not minutes.
          fetch-depth: 0

      # Binary, not the license-gated wrapper action. Pinned version + checksum.
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # The checkout as it stands. This is what the lane has always done and
      # it stays: it sees files a history scan does not reason about, and it
      # is the fastest signal on the change in front of us.
      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

      # THE HISTORY (audit 2026-09-11, B-51). The working-tree scan sees only
      # what the checkout currently contains, so a key committed by mistake
      # and deleted in the next commit was invisible to this lane for ever —
      # while remaining perfectly readable to anyone who clones the
      # repository. Deleting a secret from the tip is not revoking it.
      #
      # WHICH RANGE, AND WHY. On a PR event, the branch's OWN commits: that
      # is the new history this change proposes to add, it is the only part
      # the author can still rewrite before it lands, and it keeps the cost
      # of the always-on lane proportional to the change rather than to the
      # repository. On a push to main, the WHOLE history — which is the
      # belt-and-braces pass, and the reason a schedule is not needed here:
      # every commit that reaches main is scanned in full on the way in, so
      # there is no window a nightly sweep would close that this does not.
      #
      # If a scan of main's full history ever grows past a minute or two,
      # move the `push` branch of this step to a scheduled workflow rather
      # than dropping it — but do not put it back to tree-only.
      - name: Scan the git history
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "scanning this branch's own commits"
            gitleaks git . --no-banner --redact --config .gitleaks.toml \
              --log-opts "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            echo "scanning the full history ($(git rev-list --count HEAD) commits)"
            gitleaks git . --no-banner --redact --config .gitleaks.toml
          fi

  # Roadmap §3 standing rules 4–6: the PID §8.7 language gate and the two
  # structural greps (no `class` in the scoring path; the vault's exits are
  # exactly the enumerated set) run on every PR. Phase 0 left the language gate
  # manual because its brief scoped ci-fast to two lanes; BUILD-ROADMAP_v1.0.md
  # §3 now mandates it.
  standing-rules:
    name: standing-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Language gate (PID §8.7 + roadmap §6.4)
        run: ./scripts/check-language.sh

      - name: Structural rules (roadmap §3 rules 5–6)
        run: ./scripts/check-standing-rules.sh

      # Widened 2026-09-12 to see `env.NAME` property reads, the backend's
      # dominant shape, which it was blind to (audit 2026-09-11, A-09 / E-07 /
      # D-38). It now self-tests before reporting, like its neighbours.
      - name: Env-example coverage (E1)
        run: ./scripts/check-env-examples.sh

      # Every service image drops to a non-root user before its entrypoint
      # (audit 2026-09-11, E-22). Two of the four decode the settlement
      # signer into shared memory at boot.
      - name: Container user (E-22)
        run: ./scripts/check-container-user.sh

      # The three Python oracles still produce the vectors that are committed
      # (audit 2026-09-11, F-13). These are the numbers a player recomputes
      # their own result against, and the whole point of computing them in a
      # second language is lost the moment the two can drift unobserved.
      - name: The Python oracles reproduce their fixtures (F-13)
        run: ./scripts/check-fixtures.sh

      # Rust and TypeScript still agree (audit 2026-09-11, F-11). Constants
      # mirrored by hand across the two languages, and the `#[event]` structs
      # against the decoders that read them field by field. A regression on
      # 2026-09-12 moved a Rust figure and left three TypeScript mirrors
      # behind, green in every lane; this is the check that catches that.
      - name: Rust and TypeScript agree (F-11)
        run: python3 scripts/check-mirrors.py

      # The deploy gate's decision logic (audit 2026-09-11, G-10 / E-16). Its
      # live inputs need a GitHub token, so the only way to know it still
      # judges correctly is to drive its pure halves through fixtures: twelve
      # lane verdicts and eleven decisions, six of which must REFUSE. A gate
      # that had quietly started answering "go" to everything would otherwise
      # pass CI for ever, which is the same fault it exists to catch.
      - name: The deploy gate still judges correctly
        run: ./scripts/ci-gate.sh --self-test

      # The program-deploy script's two decisions (audit 2026-09-11, A-11 /
      # E-18): which URL a cluster name resolves to, and whether the node
      # said "no program here" or failed to answer at all. Both need a
      # cluster to exercise live, and both were wrong in a way that disabled
      # the programdata-extend guard silently, so both are driven through
      # fixtures here instead.
      - name: The program deploy still tells an outage from a fresh cluster
        run: ./scripts/deploy-devnet.sh --self-test
