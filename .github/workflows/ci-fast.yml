# ci-fast — the always-on lane.
#
# Carried from anarchy-fun's ci-fast with the services and web jobs dropped: this
# repository has no service or web suite yet (Phase 0 carried the plumbing, not a
# runnable service). Add those lanes back in the phase that makes them runnable.
#
# Two jobs:
#   rust      — fmt, clippy -D warnings, cargo test across the workspace
#   gitleaks  — filesystem scan of the checkout, pinned binary, checksum-verified
#
# No Solana CLI or Anchor install here — nothing in this lane builds SBF. The
# on-chain suite (anchor build / anchor test against a local validator) is a
# separate lane, added when programs/blotto_cup has accounts to test against.
name: ci-fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustc pinned so a silent stable-channel bump can never be the reason a
      # change goes red.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Standard proptest count — no PROPTEST_CASES override. The deep run belongs
      # to a scheduled lane, not the always-on one.
      - name: cargo test
        run: cargo test --workspace

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Binary, not the license-gated wrapper action. Pinned version + checksum.
      # Filesystem scan of the checkout only.
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

# NOTE (Phase 0): the PID §8.7 forbidden-word grep is NOT a lane here. Phase 0's
# brief scoped this workflow to the Rust and gitleaks lanes only, so the grep is
# documented in CONTRIBUTING.md → "The language gate" and run by hand for now.
# Promoting it to a third job is a one-line change and is recommended in
# EXTRACTION-REPORT.md — it is a legal-position rule (PID §8.7, compliance item
# C12), not a style preference, and review is a weaker gate than CI.
