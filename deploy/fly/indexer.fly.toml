# Fly.io app config for the indexer service (E5). Frankfurt per TECH-ARCH §11
# (EU region, never US). Deploy from the repo root:
#   fly deploy --config deploy/fly/indexer.fly.toml
# Secrets (fly secrets set ...): see docs/guide/HOSTING.md — never in this file.
app = "blotto-indexer"
primary_region = "fra"

[build]
  dockerfile = "../docker/Dockerfile.indexer"

[env]
  # Metrics and alerts (audit 2026-09-11, E-09 / A-19). Until 2026-09-12 no
  # environment selected a sink, so `createMetricsServer` was dead code and
  # every alert in the system was one line on standard output. The Prometheus
  # sink REMOVES no logging — `alert()` still writes its loud line — it adds
  # the `blotto_alerts_total{reason}` counter and an exposition to scrape.
  #
  # 9090 is NOT the routed port below: Fly routes only `internal_port`, so this
  # listener is reachable over the private network and nowhere else. That is
  # deliberate — the exposition names every counter and alert reason this
  # system keeps, which is an operational map with no reason to be public.
  #
  # Nothing scrapes it yet, and no alert destination is configured. Both are
  # operator decisions: point an agent at :9090 over the private network, and
  # set a webhook secret for the direct push if one is wanted.
  BLOTTO_MONITOR_SINK = "prometheus"
  BLOTTO_METRICS_PORT = "9090"
  BLOTTO_INDEXER_PORT = "8080"
  BLOTTO_READ_API_PORT = "8081"
  # Behind Fly's proxy: the read API's rate limiter keys on Fly-Client-IP
  # only when told the proxy is ours (2026-09-12, as the packet and review
  # services already did).
  BLOTTO_TRUST_PROXY = "1"
  # The hygiene posture, in the config that ships with the code rather than
  # only in the deploy workflow's secret staging (which also sets them):
  # rate limiting and the JSON hardening headers ON. The CORS allowlist is a
  # per-deployment origin and stays staged by the workflow.
  BLOTTO_API_RATE_LIMIT_ENABLED = "1"
  BLOTTO_API_SECURITY_HEADERS_ENABLED = "1"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

# The webhook receiver rides the same machine on its own public service —
# Helius posts here (Authorization: the shared secret; E6 validates it).
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 8080
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health"

# 512MB: the sync entry idles at ~164MB RSS measured locally (ts-node +
# web3.js + two HTTP servers), leaving no headroom for migrate/backfill
# spikes on Fly's 256MB default — an OOM kill presents exactly as the
# observed "healthy at deploy, dead minutes later". Memory is the one
# resource a crash-looping service cannot log its way out of.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
