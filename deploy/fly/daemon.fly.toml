# Fly.io app config for the daemon service (E5). Frankfurt per TECH-ARCH §11
# (EU region, never US). Deploy from the repo root:
#   fly deploy --config deploy/fly/daemon.fly.toml
# Secrets (fly secrets set ...): see docs/guide/HOSTING.md — never in this file.
app = "blotto-daemon"
primary_region = "fra"

[build]
  dockerfile = "../docker/Dockerfile.daemon"

# DECLARED, not defaulted. On 2026-09-06 this file had no [[vm]] block, so the
# machine ran on Fly's 256 MB default — and the daemon is by a distance the
# heaviest of the four services: it loads the Turnkey SDK, Switchboard
# On-Demand, the Irys uploader, @solana/web3.js and the detection pipeline in
# one process, all through ts-node. It was OOM-killed at ~126 MB resident, and
# on the following boot spent 5m35s inside a single synchronous require,
# thrashing. A blocked event loop cannot answer its own health endpoint, so the
# service looked unreachable rather than starved.
#
# 1 GB is the next size up and leaves roughly 4x headroom over the observed
# working set. The real fix is to stop running ts-node in production (see
# Dockerfile.daemon); this is sized so that change is an improvement rather
# than a prerequisite.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[env]
  # Metrics and alerts (audit 2026-09-11, E-09 / A-19). Until 2026-09-12 no
  # environment selected a sink, so `createMetricsServer` was dead code and
  # every alert in the system was one line on standard output. The Prometheus
  # sink REMOVES no logging — `alert()` still writes its loud line — it adds
  # the `blotto_alerts_total{reason}` counter and an exposition to scrape.
  #
  # 9090 is NOT the routed port below: Fly routes only `internal_port`, so this
  # listener is reachable over the private network and nowhere else. That is
  # deliberate — the exposition names every counter and alert reason this
  # system keeps, which is an operational map with no reason to be public.
  #
  # Nothing scrapes it yet, and no alert destination is configured. Both are
  # operator decisions: point an agent at :9090 over the private network, and
  # set a webhook secret for the direct push if one is wanted.
  BLOTTO_MONITOR_SINK = "prometheus"
  BLOTTO_METRICS_PORT = "9090"
  BLOTTO_DAEMON_HEALTH_PORT = "8084"

[http_service]
  internal_port = 8084
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  # 60s, not 30: the daemon binds /health immediately and reports its startup
  # phase, but the Switchboard queue fetch and the Irys uploader take ~25s
  # between them on a cold start. The 30s here predated both.
  grace_period = "300s"
  method = "GET"
  path = "/health"
