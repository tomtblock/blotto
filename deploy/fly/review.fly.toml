# Fly.io app config for the review service (E5). Frankfurt per TECH-ARCH §11
# (EU region, never US). Deploy from the repo root:
#   fly deploy --config deploy/fly/review.fly.toml
# Secrets (fly secrets set ...): see docs/hosting.md — never in this file.
app = "blotto-review"
primary_region = "fra"

[build]
  dockerfile = "../docker/Dockerfile.review"

[env]
  BLOTTO_REVIEW_PORT = "8083"
  # Behind Fly's proxy: the rate limiter keys on Fly-Client-IP (Stage E).
  BLOTTO_TRUST_PROXY = "1"
  # The hygiene posture, in the config that ships with the code rather than
  # only in the deploy workflow's secret staging (which also sets them).
  # The CORS allowlist is a per-deployment origin and stays staged there.
  BLOTTO_API_RATE_LIMIT_ENABLED = "1"
  BLOTTO_API_SECURITY_HEADERS_ENABLED = "1"

[http_service]
  internal_port = 8083
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

# DECLARED, not defaulted. The review service is the lightest of the four and
# has never failed on memory — this is here because "no [[vm]] block" silently
# means 256 MB, and that default has now taken down two of the other three
# (daemon 2026-09-06, packet 2026-09-08). An undeclared limit is not a small
# limit chosen; it is no limit chosen. 512 MB matches the indexer, whose
# footprint this service's most resembles.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
